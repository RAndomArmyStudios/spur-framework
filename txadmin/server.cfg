# SPUR on RedM, written by the txAdmin recipe. Don't put a semicolon in a comment: FXServer ends the command there.

{{serverEndpoints}}

set gamename rdr3
sv_maxclients {{maxClients}}
sv_hostname "{{recipeName}}"
sets sv_projectName "{{recipeName}}"
sets sv_projectDesc "{{recipeDescription}}"
sets tags "spur, roleplay"
sets locale "en-US"

sv_licenseKey "{{svLicense}}"
set mysql_connection_string "{{dbConnectionString}}"

ensure oxmysql
ensure spur_core
ensure spur_chat
ensure spur_loadingscreen
ensure spur_gunny
ensure spur_rope
ensure spur_voice
ensure spur_phone
# ensure spur_test

add_ace group.admin whip.devtools allow
add_ace group.admin command allow
{{addPrincipalsMaster}}
